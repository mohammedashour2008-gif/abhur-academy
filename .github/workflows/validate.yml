name: Validate ABHUR website
on:
  push:
    branches: [feature/abhur-website-v1]
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check assets/letters-game.js
      - name: Check internal links and RTL
        run: python3 scripts/validate_site.py
